# digitalKaizer - Better Tanks
# Master config for Bastion + Storm/Maelstrom tank customization.
# Runtime path:
# %LOCALAPPDATA%\CowboyBingus\Helldivers2\Config\digitalKaizer-BetterTanks.ini
#
# DEFAULT CONFIG:
# These are the default Better Tanks settings and intentionally differ from vanilla.
# 
# Restart Helldivers 2 after editing unless a setting explicitly says otherwise.
#
# Main-gun DAMAGE / AP is intentionally NOT exposed here.
# Storm missile DAMAGE / blast radius is intentionally NOT modified.
#
# =====================================================================
# BASTION - DURABILITY / ARMOR
# =====================================================================

# Main tank health pool. Stock/default: 8000
bastion_main_health=9001

# By default, after the main health is depleted you have 7 seconds to get clear of the tank before it detonates.
# Increasing the constitution value or lowering the decay rate (or combination of both) will give you more time.

# Constitution ("negative health" after normal health). Stock/default: 70000
bastion_constitution=70000

# Constitution change per second; negative drains it. Stock/default: -10000
bastion_constitution_decay=-7000

# Armor zones 0,1,2,26. Stock/default: AV4
# These are the selected frontal armor zones used by Better Tanks.
bastion_frontal_armor=6

# Stowage / lunch-box armor zones 6-11. Stock/default: AV2
bastion_stowage_armor=5

# Side-skirt armor zones 16-23. Stock/default: AV4
bastion_side_skirt_armor=5

# Additional structural AV4 zones: 3-5,12-15,24-25,27-28.
# Stock/default: AV4
# Exact player-facing geometry names for every numbered zone are NOT confirmed,
# so this group is deliberately not labeled "rear" or "side hull".
bastion_structural_av4_armor=5

# Main-health damage transfer for stowage zones 6-11.
# 0.00 = 0%; 1.00 = 100%. Stock/default: 0.00
bastion_stowage_main_transfer=0.0

# Main-health damage transfer for side skirts 16-23.
# Stock/default: 1.00 = 100% to main / 0.1 = 10% to main
bastion_side_skirt_main_transfer=0.1

# Main-health damage transfer for zones 0-5,12-15,24-28.
# Stock/default: 1.00 100% to main / 0.1 = 10% to main
bastion_other_main_transfer=0.7

# ExplosiveDamagePercentage for main/default and applicable zones.
# This is damage TAKEN. 0.40 = 40% taken / 60% resistance ("ExDR").
# Stock/default: 0.40
bastion_explosive_damage_taken=0.20

# =====================================================================
# BASTION - HANDLING
# =====================================================================

# VehicleMotion acceleration. Stock/default: 10.0; exact physical unit unknown.
# Tested many values for this number. 13 feels just right for trying to get up to speed
# But still being able to accelerate reasonably while attempting to turn.
bastion_acceleration=13.0

# Steering response. Stock/default: 2.25; exact formula/unit unknown.
# This was not as extensively tested, but absurdly high values of this stat didn't help.
# Lowering it from default seemed pointless. But Somewhere between 4 and 10 felt OK
bastion_steering_response=8.0

# Throttle response. Stock/default: 4.0; exact formula/unit unknown.
bastion_throttle_response=8.0

# Brake response. Stock/default: 10.0; exact formula/unit unknown.
# Adjusting this value seemed to make little difference in any case.
bastion_brake_response=10.0

# Five unnamed VehicleTracksComponent coefficients.
# It is not well known what these values manipulate exactly.
# However I have found little noticeable differences in trying to slightly or greatly
# modify the first three values. However doubling the last two values seems to improve turning.
# Going much higher than double the stock value actually makes the handling worse in some ways.
# I've found 16 seems to be a reasonable balance.
# Stock/defaults: 1 / 22 / 3 / 8 / 8
bastion_unknown_tracked_coefficient_1=1.0
bastion_unknown_tracked_coefficient_2=22.0
bastion_unknown_tracked_coefficient_3=3.0
bastion_unknown_tracked_coefficient_4=16.0
bastion_unknown_tracked_coefficient_5=16.0

# If anyone has any light to shed on what these factors do please feel free to share with the class.

# =====================================================================
# BASTION - WEAPONS / AMMO
# =====================================================================

# Includes one loaded breech shell. Stock/default: 31 (30 reserve + 1 loaded)
bastion_cannon_total_shells=32

# Coax/HMG ammunition. Stock/default: 2000
bastion_hmg_ammo=3000

# Main cannon fire rate. Stock/default: 12 RPM
bastion_cannon_rpm=12

# HMG fire rate. Stock/default: 600 RPM
bastion_hmg_rpm=900

# Cannon reload duration. Lower = faster. Stock/default: 4.0 seconds
bastion_cannon_reload_seconds=2.5

# =====================================================================
# STORM / MAELSTROM - DURABILITY / ARMOR
# =====================================================================

# Stock/default: 8000
storm_main_health=9001
# Stock/default: 70000
storm_constitution=70000
# Stock/default: -10000
storm_constitution_decay=-7000

# Armor zones 0,1,2,26. Stock/default: AV4
storm_frontal_armor=6

# Stowage zones 6-11. Stock/default: AV2
storm_stowage_armor=5

# Side skirts 16-23. Stock/default: AV4
storm_side_skirt_armor=5

# Additional structural AV4 zones 3-5,12-15,24-25,27-28.
# Stock/default: AV4. Exact geometry labels not fully confirmed.
storm_structural_av4_armor=5

# Stock/default: 0.00
storm_stowage_main_transfer=0.0
# Stock/default: 1.00
storm_side_skirt_main_transfer=0.1
# Stock/default: 1.00
storm_other_main_transfer=0.7
# Stock/default: 0.40 = 40% explosive damage taken
storm_explosive_damage_taken=0.20

# =====================================================================
# STORM / MAELSTROM - HANDLING
# =====================================================================

storm_acceleration=13.0
storm_steering_response=8.0
storm_throttle_response=8.0
storm_brake_response=10.0
storm_unknown_tracked_coefficient_1=1.0
storm_unknown_tracked_coefficient_2=22.0
storm_unknown_tracked_coefficient_3=3
storm_unknown_tracked_coefficient_4=16.0
storm_unknown_tracked_coefficient_5=16.0

# =====================================================================
# STORM / MAELSTROM - WEAPONS / AMMO
# =====================================================================

# Gatling rounds per belt. Stock/default: 300
storm_main_gun_rounds_per_belt=1000

# Spare Gatling belts. Stock/default: 6
# Using a value other than 6 here, breaks integrated Tank HUD UI
storm_main_gun_spare_belts=6

# Gatling reload duration. 0 = game ability default.
# Stock/default: 4.0 seconds
storm_main_gun_reload_seconds=2.5

# Combined twin-Gatling fire rate. Stock/default: 1200 RPM
storm_main_gun_rpm=2000

# Driver smoke total charges. Stock/default: 20
storm_smoke_total=20

# Delay between smoke launches. Stock/default: 5.0 seconds
storm_smoke_delay_seconds=5.0

# Total missiles across both rear launchers. Stock/default: 20
storm_missiles_total=20

# =====================================================================
# STRATAGEM COOLDOWNS
# =====================================================================

# Base Bastion stratagem cooldown. Stock/default: 780 seconds
bastion_cooldown_seconds=600

# Base Storm/Maelstrom stratagem cooldown. Stock/default: 780 seconds
storm_cooldown_seconds=600
