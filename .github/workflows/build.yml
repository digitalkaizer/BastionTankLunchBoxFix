name: Build Arsenal Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify
        run: python build_bastion_lunchbox_fixes.py

      - name: Upload Arsenal package
        uses: actions/upload-artifact@v4
        with:
          name: Bastion_Lunchbox_Fixes_v1.0.6_ExactV13_Arsenal
          path: Bastion_Lunchbox_Fixes_v1.0.6_ExactV13_Arsenal.zip
          if-no-files-found: error
